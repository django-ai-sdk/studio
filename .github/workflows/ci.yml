name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      # Same Xcode as local builds (27.x); the image default can lag behind, so pick the newest.
      - name: Select Xcode
        run: |
          # shellcheck disable=SC2012 # Xcode_27.x.app names are plain; ls + sort -V is fine here.
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[7-9]*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('mac/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build macOS app
        run: swift build

      - name: Build iOS app (simulator)
        run: |
          brew install xcodegen
          make ios-build
