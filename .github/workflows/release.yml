name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      # Same Xcode as local builds (27.x); the image default can lag behind, so pick the newest.
      - name: Select Xcode
        run: |
          # shellcheck disable=SC2012 # Xcode_27.x.app names are plain; ls + sort -V is fine here.
          sudo xcode-select -s "$(ls -d /Applications/Xcode_2[7-9]*.app | sort -V | tail -1)"
          xcodebuild -version

      # Tag v0.1.0a1 → VERSION 0.1.0a1 (CFBundleShortVersionString 0.1.0),
      # BUILD = run number (CFBundleVersion). Unsigned: ad-hoc codesign, not notarized.
      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          make dmg VERSION="$VERSION" BUILD=${{ github.run_number }}

      - name: Checksum
        working-directory: mac/build
        run: shasum -a 256 "Studio-$VERSION.dmg" > SHA256SUMS && cat SHA256SUMS

      # A tag with a letter in the version (v0.1.0a1, v0.1.0b2, v0.1.0rc1) is a pre-release. --notes-file is prepended
      # to the generated notes (install steps first, then the changes since the last tag).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "${GITHUB_REF_NAME#v}" =~ [A-Za-z] ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "build/Studio-$VERSION.dmg" build/SHA256SUMS \
            --title "Studio $VERSION" \
            --generate-notes --notes-file ../.github/release-notes.md \
            "${prerelease[@]}"
