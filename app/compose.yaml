name: studio

x-app: &app
  image: ghcr.io/astral-sh/uv:0.13-python3.13-trixie-slim
  working_dir: /src/app/studio
  env_file: studio/.env
  environment:
    SDK: pypi
    UV_PROJECT_ENVIRONMENT: /venv
    UV_LINK_MODE: copy
  volumes:
    - .:/src/app
    - venv:/venv
    - uv-cache:/root/.cache/uv

services:
  setup:
    <<: *app
    working_dir: /src/app
    command:
      - sh
      - -euc
      - |
        if [ "$$SDK" = local ]; then
          uv sync --frozen --no-dev
        else
          uv venv --allow-existing /venv
          uv export --frozen --no-dev --no-hashes --no-emit-package django-ai-sdk -o /tmp/requirements.txt
          uv pip install --python /venv --prerelease allow --reinstall-package django-ai-sdk -r /tmp/requirements.txt "django-ai-sdk[qdrant,mcp,files,dbos]"
        fi
        cd studio && /venv/bin/python manage.py migrate

  web:
    <<: *app
    command: ["/venv/bin/python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["${PORT:-8000}:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["/venv/bin/python", "manage.py", "ai_sdk_worker"]
    depends_on:
      setup: {condition: service_completed_successfully}

volumes:
  venv:
  uv-cache:
