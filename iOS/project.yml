# XcodeGen spec for the iPhone/iPad app. Generate with `make ios-project` (xcodegen generate).
# The iOS target compiles the same ../Sources as the macOS app; platform differences use #if os(...).
name: StudioiOS
options:
  bundleIdPrefix: nl.django-ai-sdk
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.5.0
targets:
  Studio:
    type: application
    platform: iOS
    sources:
      - path: ../Sources
      - path: Assets.xcassets
    dependencies:
      - package: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.django-ai-sdk.studio.ios
        PRODUCT_NAME: Studio
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Studio connects to your development server on the local network.
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
  StudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Studio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.django-ai-sdk.studio.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Studio
schemes:
  Studio:
    build:
      targets:
        Studio: all
        StudioUITests: [test]
    test:
      targets:
        - StudioUITests
